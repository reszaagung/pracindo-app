    get:
      operationId: v1_warehouse_laporan_selisih_list
      description: |-
        Dua tampilan dari objek yang sama, dipilih dari query param ?sisi=.

        Default `gudang` -- tanpa nilai rupiah. Sisi `akunting` hanya terbuka
        untuk pengguna yang boleh masuk modul akunting.
      parameters:
      - in: query
        name: jenis
        schema:
          type: string
          enum:
          - BERAT_KURANG
          - KURANG_KIRIM
          - LEBIH_KIRIM
          - MUTU
          - RUSAK
          - SALAH_BARANG
        description: |-
          * `KURANG_KIRIM` - Kurang kirim
          * `LEBIH_KIRIM` - Lebih kirim
          * `BERAT_KURANG` - Berat kurang dari label
          * `RUSAK` - Barang rusak
          * `SALAH_BARANG` - Barang tidak sesuai pesanan
          * `MUTU` - Mutu tidak sesuai
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: penerimaan
        schema:
          type: integer
      - in: query
        name: resolusi
        schema:
          type: string
          enum:
          - GANTI
          - POTONG
          - RETUR
          - SUSULAN
          - TERIMA
        description: |-
          * `TERIMA` - Terima apa adanya
          * `POTONG` - Potong tagihan
          * `SUSULAN` - Suplier kirim susulan
          * `RETUR` - Retur ke suplier
          * `GANTI` - Ganti barang
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DIAJUKAN
          - DIBUKA
          - DISELESAIKAN
          - DISEPAKATI
          - DITUTUP
        description: |-
          * `DIBUKA` - Dibuka
          * `DIAJUKAN` - Diajukan ke suplier
          * `DISEPAKATI` - Disepakati suplier
          * `DISELESAIKAN` - Selesai
          * `DITUTUP` - Ditutup tanpa klaim
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLaporanSelisihGudangList'
          description: ''
