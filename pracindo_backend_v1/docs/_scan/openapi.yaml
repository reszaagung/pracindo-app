components:
  schemas:
    Akun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kode:
          type: string
          maxLength: 8
        nama:
          type: string
          maxLength: 120
        tipe:
          $ref: '#/components/schemas/TipeEnum'
        saldo_normal:
          type: string
          readOnly: true
        parent:
          type: integer
          nullable: true
        boleh_diposting:
          type: boolean
        aktif:
          type: boolean
      required:
      - id
      - kode
      - nama
      - saldo_normal
      - tipe
    BlankEnum:
      enum:
      - ''
    DataKepegawaian:
      type: object
      description: Sensitif. Hanya pemilik dan Supervisor yang boleh membacanya.
      properties:
        id:
          type: integer
          readOnly: true
        profil:
          type: integer
          readOnly: true
        nik_ktp:
          type: string
          maxLength: 16
        npwp:
          type: string
          maxLength: 20
        tempat_lahir:
          type: string
          maxLength: 80
        tanggal_lahir:
          type: string
          format: date
          nullable: true
        usia:
          type: integer
          readOnly: true
        jenis_kelamin:
          oneOf:
          - $ref: '#/components/schemas/JenisKelaminEnum'
          - $ref: '#/components/schemas/BlankEnum'
        alamat:
          type: string
        status_pajak:
          oneOf:
          - $ref: '#/components/schemas/StatusPajakEnum'
          - $ref: '#/components/schemas/BlankEnum'
        bank:
          type: string
          maxLength: 40
        no_rekening:
          type: string
          maxLength: 40
        nama_rekening:
          type: string
          maxLength: 120
        kontak_darurat_nama:
          type: string
          maxLength: 120
        kontak_darurat_hubungan:
          type: string
          maxLength: 40
        kontak_darurat_hp:
          type: string
          maxLength: 20
      required:
      - id
      - profil
      - usia
    DepartemenEnum:
      enum:
      - GUDANG
      - AKUNTING
      - KEUANGAN
      - PRODUKSI
      - PENJUALAN
      - UMUM
      type: string
      description: |-
        * `GUDANG` - Gudang
        * `AKUNTING` - Akunting
        * `KEUANGAN` - Keuangan
        * `PRODUKSI` - Produksi
        * `PENJUALAN` - Penjualan
        * `UMUM` - Umum
    Entitas:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kode:
          type: string
          readOnly: true
        nama:
          type: string
          maxLength: 120
        jenis:
          $ref: '#/components/schemas/EntitasJenisEnum'
        jenis_label:
          type: string
          readOnly: true
        npwp:
          type: string
          maxLength: 20
        grup_bahan:
          type: integer
        grup_bahan_kode:
          type: string
          readOnly: true
        aktif:
          type: boolean
      required:
      - grup_bahan
      - grup_bahan_kode
      - id
      - jenis
      - jenis_label
      - kode
      - nama
    EntitasJenisEnum:
      enum:
      - BADAN_HUKUM
      - PERORANGAN
      type: string
      description: |-
        * `BADAN_HUKUM` - Badan hukum
        * `PERORANGAN` - Perorangan
    FakturList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomor_faktur:
          type: string
          maxLength: 64
        entitas_kode:
          type: string
          readOnly: true
        suplier_nama:
          type: string
          readOnly: true
        tanggal_faktur:
          type: string
          format: date
        tanggal_jatuh_tempo:
          type: string
          format: date
          readOnly: true
        total_tagihan:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        sisa_hutang:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/Status5faEnum'
        terlambat:
          type: boolean
          readOnly: true
      required:
      - entitas_kode
      - id
      - nomor_faktur
      - sisa_hutang
      - suplier_nama
      - tanggal_faktur
      - tanggal_jatuh_tempo
      - terlambat
      - total_tagihan
    FakturPembelian:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        no_internal:
          type: string
          readOnly: true
        nomor_faktur:
          type: string
          maxLength: 64
        jenis:
          $ref: '#/components/schemas/FakturPembelianJenisEnum'
        entitas:
          type: integer
        entitas_kode:
          type: string
          readOnly: true
        suplier:
          type: integer
        suplier_nama:
          type: string
          readOnly: true
        penerimaan:
          type: integer
          nullable: true
        penerimaan_nomor:
          type: string
          readOnly: true
        tanggal_faktur:
          type: string
          format: date
        termin_hari:
          type: integer
          maximum: 32767
          minimum: 0
        tanggal_jatuh_tempo:
          type: string
          format: date
          readOnly: true
        total_tagihan:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_dibayar:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        sisa_hutang:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status5faEnum'
          readOnly: true
        terlambat:
          type: boolean
          readOnly: true
        umur_hari:
          type: integer
          readOnly: true
        dokumen:
          type: integer
          nullable: true
        catatan:
          type: string
        mutasi:
          type: array
          items:
            $ref: '#/components/schemas/KartuHutang'
          readOnly: true
      required:
      - entitas
      - entitas_kode
      - id
      - mutasi
      - no_internal
      - nomor_faktur
      - penerimaan_nomor
      - sisa_hutang
      - status
      - suplier
      - suplier_nama
      - tanggal_faktur
      - tanggal_jatuh_tempo
      - terlambat
      - total_dibayar
      - total_tagihan
      - umur_hari
    FakturPembelianJenisEnum:
      enum:
      - BARANG
      - JASA
      type: string
      description: |-
        * `BARANG` - Pembelian barang
        * `JASA` - Jasa / beban
    GrupBahan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kode:
          type: string
          maxLength: 16
        nama:
          type: string
          maxLength: 120
      required:
      - id
      - kode
      - nama
    Jabatan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kode:
          type: string
          maxLength: 16
        nama:
          type: string
          maxLength: 120
        departemen:
          $ref: '#/components/schemas/DepartemenEnum'
        level:
          type: integer
          maximum: 32767
          minimum: 0
        aktif:
          type: boolean
      required:
      - id
      - kode
      - nama
    JenisKelaminEnum:
      enum:
      - L
      - P
      type: string
      description: |-
        * `L` - Laki-laki
        * `P` - Perempuan
    JenisKemasanEnum:
      enum:
      - KARUNG
      - DRUM
      - JERIGEN
      - DUS
      - SAK
      - CURAH
      type: string
      description: |-
        * `KARUNG` - Karung
        * `DRUM` - Drum
        * `JERIGEN` - Jerigen
        * `DUS` - Dus
        * `SAK` - Sak
        * `CURAH` - Curah / tanpa kemasan
    JurnalDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        akun:
          type: integer
        akun_kode:
          type: string
          readOnly: true
        akun_nama:
          type: string
          readOnly: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        kredit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        keterangan:
          type: string
          maxLength: 255
      required:
      - akun
      - akun_kode
      - akun_nama
      - id
    JurnalUmum:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomor:
          type: string
          readOnly: true
        tanggal:
          type: string
          format: date
        entitas:
          type: integer
        entitas_kode:
          type: string
          readOnly: true
        kejadian:
          $ref: '#/components/schemas/KejadianEnum'
        referensi:
          type: string
          maxLength: 64
        keterangan:
          type: string
          maxLength: 255
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_kredit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        seimbang:
          type: boolean
          readOnly: true
        sudah_dibalik:
          type: boolean
          readOnly: true
        baris:
          type: array
          items:
            $ref: '#/components/schemas/JurnalDetail'
          readOnly: true
      required:
      - baris
      - entitas
      - entitas_kode
      - id
      - kejadian
      - nomor
      - seimbang
      - sudah_dibalik
      - tanggal
      - total_debit
      - total_kredit
    KartuHutang:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tanggal:
          type: string
          format: date
        jenis:
          $ref: '#/components/schemas/KartuHutangJenisEnum'
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        kredit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        referensi:
          type: string
          maxLength: 64
      required:
      - id
      - jenis
      - tanggal
    KartuHutangJenisEnum:
      enum:
      - FAKTUR
      - BAYAR
      - RETUR
      - KOREKSI
      type: string
      description: |-
        * `FAKTUR` - Faktur diterbitkan
        * `BAYAR` - Pembayaran
        * `RETUR` - Retur pembelian
        * `KOREKSI` - Koreksi / pembatalan
    KejadianEnum:
      enum:
      - AUDIT_GUDANG
      - FAKTUR_MASUK
      - SELISIH_HARGA
      - BAYAR_HUTANG
      - RETUR_BELI
      - PENJUALAN
      - TERIMA_PIUTANG
      - BEBAN_KAS
      - PENYUSUTAN
      - PRODUKSI
      - KOREKSI
      type: string
      description: |-
        * `AUDIT_GUDANG` - Penerimaan barang
        * `FAKTUR_MASUK` - Faktur pembelian masuk
        * `SELISIH_HARGA` - Selisih harga faktur
        * `BAYAR_HUTANG` - Pembayaran hutang
        * `RETUR_BELI` - Retur pembelian
        * `PENJUALAN` - Penjualan
        * `TERIMA_PIUTANG` - Penerimaan piutang
        * `BEBAN_KAS` - Beban dibayar tunai
        * `PENYUSUTAN` - Penyusutan aset tetap
        * `PRODUKSI` - Rekonsiliasi sesi produksi
        * `KOREKSI` - Jurnal balik / koreksi
    KepemilikanGudang:
      type: object
      description: Siapa memiliki berapa. TIDAK ADA nilai rupiah.
      properties:
        entitas:
          type: integer
        entitas_kode:
          type: string
          readOnly: true
        qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - entitas
      - entitas_kode
      - qty
    LapisEnum:
      enum:
      - RAW
      - POOL
      - JADI
      type: string
      description: |-
        * `RAW` - Bahan bertuan
        * `POOL` - Pool produksi
        * `JADI` - Barang jadi
    LaporanSelisihGudang:
      type: object
      description: |-
        Tampilan gudang. nilai_selisih dan nilai_klaim SENGAJA tidak ada --
        gudang melaporkan fakta fisik, akunting yang menilai rupiahnya.
      properties:
        id:
          type: integer
          readOnly: true
        nomor:
          type: string
          readOnly: true
        penerimaan:
          type: integer
        penerimaan_nomor:
          type: string
          readOnly: true
        penerimaan_item:
          type: integer
          nullable: true
        tanggal:
          type: string
          format: date
        jenis:
          $ref: '#/components/schemas/LaporanSelisihGudangJenisEnum'
        jenis_label:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/LaporanSelisihGudangStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        qty_selisih:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        uraian:
          type: string
        foto:
          type: integer
          nullable: true
        umur_hari:
          type: integer
          readOnly: true
      required:
      - id
      - jenis
      - jenis_label
      - nomor
      - penerimaan
      - penerimaan_nomor
      - status
      - status_label
      - umur_hari
      - uraian
    LaporanSelisihGudangJenisEnum:
      enum:
      - KURANG_KIRIM
      - LEBIH_KIRIM
      - BERAT_KURANG
      - RUSAK
      - SALAH_BARANG
      - MUTU
      type: string
      description: |-
        * `KURANG_KIRIM` - Kurang kirim
        * `LEBIH_KIRIM` - Lebih kirim
        * `BERAT_KURANG` - Berat kurang dari label
        * `RUSAK` - Barang rusak
        * `SALAH_BARANG` - Barang tidak sesuai pesanan
        * `MUTU` - Mutu tidak sesuai
    LaporanSelisihGudangStatusEnum:
      enum:
      - DIBUKA
      - DIAJUKAN
      - DISEPAKATI
      - DISELESAIKAN
      - DITUTUP
      type: string
      description: |-
        * `DIBUKA` - Dibuka
        * `DIAJUKAN` - Diajukan ke suplier
        * `DISEPAKATI` - Disepakati suplier
        * `DISELESAIKAN` - Selesai
        * `DITUTUP` - Ditutup tanpa klaim
    MutasiStok:
      type: object
      properties:
        id:
          type: integer
