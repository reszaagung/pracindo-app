services:
  db:
    image: postgres:15-alpine
    container_name: pracindo_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    networks:
      - default

  backend:
    build:
      context: ./pracindo_backend_v1
    container_name: pracindo_backend
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.pracindo-api.rule=Host(`pracindo.cloud`) && PathPrefix(`/api/`)
      - traefik.http.routers.pracindo-api.entrypoints=websecure
      - traefik.http.routers.pracindo-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pracindo-api.priority=100
      - traefik.http.services.pracindo-api.loadbalancer.server.port=8000
      - traefik.docker.network=pracindo-app_default
      - traefik.http.routers.pracindo-admin.rule=Host(`pracindo.cloud`) && PathPrefix(`/8243e09f83b0e1e21827c2824180297939b4747cff46d22b27b2721111e87bfe/`)
      - traefik.http.routers.pracindo-admin.entrypoints=websecure
      - traefik.http.routers.pracindo-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.pracindo-admin.priority=100
      - traefik.http.routers.pracindo-admin.service=pracindo-api
    networks:
      - default

  frontend:
    build:
      context: ./pracindo-frontend
      dockerfile: Dockerfile
    container_name: pracindo_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.pracindo.rule=Host(`pracindo.cloud`)
      - traefik.http.routers.pracindo.entrypoints=websecure
      - traefik.http.routers.pracindo.tls.certresolver=letsencrypt
      - traefik.http.routers.pracindo.priority=1
      - traefik.http.services.pracindo.loadbalancer.server.port=80
      - traefik.docker.network=pracindo-app_default
    networks:
      - default

networks:
  default:
    name: pracindo-app_default
    external: true

volumes:
  postgres_data:
  media_data:
  static_data: